services:
  - type: web
    name: wende-brand-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: store-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/store.sqlite
      - key: CORS_ORIGINS
        value: https://www.codealpha.tech,https://codealpha.tech,https://code-alpha-fashion-store-zuw8.vercel.app,https://code-alpha-fashion-store.vercel.app
      - key: PUBLIC_APP_URL
        value: https://www.codealpha.tech
      - key: STORE_MODE
        value: preview
